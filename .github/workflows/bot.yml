name: Upstox Alert Bot

on:
  schedule:
    - cron: "30 1 * * 1-5"   # 07:00 IST, Mon–Fri (GitHub may start it 5–30 min late;
                             # NSE holidays are skipped inside the bot in ~1 min)
  workflow_dispatch:          # "Run workflow" button for manual starts

permissions:
  contents: write   # keep-alive commit (GitHub pauses schedules after 60 idle days)
  actions: write    # start the next run when this one hits its time limit

concurrency:
  group: upstox-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"
      STATE_DIR: data
      UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
      UPSTOX_SECRET: ${{ secrets.UPSTOX_SECRET }}
      UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      BOT_SETTINGS: ${{ vars.BOT_SETTINGS }}   # optional KEY=VALUE lines
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore saved state (token, positions, today's alerts)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run bot
        id: bot
        run: |
          mkdir -p data
          python main.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Continue in a fresh run
        if: steps.bot.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref "${{ github.ref_name }}"

      - name: Keep schedule alive
        if: always()
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt 4320000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive" && git push
          fi
